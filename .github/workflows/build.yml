name: build

# 三平台安装包构建 + 发布到 GitHub Release。
# 说明：安装包均未签名（无证书）——
#   Windows 首次运行有 SmartScreen 提示；macOS 需右键 → 打开绕过 Gatekeeper；
#   Linux 无签名校验。个人项目可接受，如需正式分发请配置代码签名。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # macOS：在生成完整性清单之前先对 SDK 原生二进制做 ad-hoc 签名。
      # 之后 afterPack 会再对 .app --deep 签名（ad-hoc 幂等，哈希不变），
      # 这样清单里记录的就是签名后 claude 的哈希，启动校验才能通过。
      - name: Ad-hoc sign SDK binary (macOS only)
        if: runner.os == 'macOS'
        run: |
          for b in node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/claude; do
            [ -f "$b" ] && codesign --force --sign - "$b"
          done

      # 完整性清单（runtime-integrity.json）按平台生成：SDK 原生二进制路径
      #（claude.exe / claude / darwin / linux）随平台不同，必须在本平台重新生成，
      # 否则打包后启动时的完整性校验会因清单指向缺失的跨平台二进制而失败。
      - name: Regenerate integrity manifest
        run: npm run integrity

      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          # 不自动寻找签名身份，产出未签名/自动 ad-hoc 签名的包
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: electron-builder

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  release:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
