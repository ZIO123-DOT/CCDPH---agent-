name: build

# 三平台安装包构建 + 发布到 GitHub Release。
# macOS 发布必须使用 Developer ID Application 签名并通过 Apple 公证；缺少凭据或
# Gatekeeper 验证失败时整个发布失败，避免再次上传“下载后无法打开”的 dmg。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require macOS signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required macOS release credentials: ${missing[*]}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # 完整性清单（runtime-integrity.json）按平台生成：SDK 原生二进制路径
      #（claude.exe / claude / darwin / linux）随平台不同，必须在本平台重新生成，
      # 否则打包后启动时的完整性校验会因清单指向缺失的跨平台二进制而失败。
      - name: Regenerate integrity manifest
        run: npm run integrity

      - name: Build installers (Windows/Linux)
        if: runner.os != 'macOS'
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: electron-builder

      - name: Build signed and notarized macOS installer
        if: runner.os == 'macOS'
        run: npm run ${{ matrix.script }}
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          DEBUG: electron-builder

      - name: Verify signed and notarized macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="release/mac-arm64/CCDPH.app"
          dmg_path="$(find release -maxdepth 1 -name 'ccdph-*-macos-arm64.dmg' -print -quit)"
          test -d "$app_path"
          test -f "$dmg_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          codesign -dvvv "$app_path" 2>&1 | grep -q 'Authority=Developer ID Application'
          CCDPH_PACKAGED_APP="$app_path" node tests/packaged-runtime-integrity.mjs
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          hdiutil verify "$dmg_path"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  release:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
